name: docker-compose-test

on:
  workflow_call:
  push:
    branches:
      - '*'
      - '!deploy'
      - '!gh-pages'

permissions:
  contents: read

concurrency:
  group: self-hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-compose-tests:
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096
    # this has a chance of infinite loop if we write a test wrong, timeout should catch it eventually.
    timeout-minutes: 20
    runs-on: self-hosted

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Load .env variables
        run: |
          cp .env.example .env
          echo "Loaded .env variables"

      - name: Install Dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Set up Supabase + Build Docker image (parallel)
        run: |
          set -euo pipefail

          echo "Preparing Supabase setup and Docker build..."
          COMMIT_HASH=$(git rev-parse --short HEAD)
          SCHEMA_NAME="docker_test_${COMMIT_HASH}"
          echo "SCHEMA_NAME=${SCHEMA_NAME}" >> "$GITHUB_ENV"
          sed -i "s/^project_id = .*/project_id = \"${SCHEMA_NAME}\"/" supabase/config.toml

          (
            set -euo pipefail
            echo "[Supabase] Starting setup..."
            pnpm script supabase/sb-random-ports
            pnpm sb:start --debug
            echo "[Supabase] Waiting for readiness..."
            until pnpm run sb:status | grep -q "Development Tools"; do
              echo "[Supabase] Not ready yet, waiting..."
              sleep 5
            done
            echo "[Supabase] Configuring local supabase"
            pnpm run sb:local-config
            pnpm run sb:push
            echo "[Supabase] Setup complete"
          ) > supabase-setup.log 2>&1 &
          SUPABASE_PID=$!

          echo "[Docker] Building image while Supabase starts..."
          set +e
          docker build -t my-app:latest .
          BUILD_STATUS=$?
          wait "$SUPABASE_PID"
          SUPABASE_STATUS=$?
          set -e

          echo "----- Supabase setup log -----"
          cat supabase-setup.log

          if [[ "$BUILD_STATUS" -ne 0 || "$SUPABASE_STATUS" -ne 0 ]]; then
            echo "Parallel setup failed (docker=$BUILD_STATUS, supabase=$SUPABASE_STATUS)"
            exit 1
          fi

      - name: Init supabase types
        run: pnpm run sb:pull-types

      - name: Debug Docker images
        run: |
          echo "Listing all docker images:"
          docker images
          echo "Compose images for project 'test':"
          docker compose --project-name test images
          echo "Compose ps for project 'test':"
          docker compose --project-name test ps

      - name: Start App
        run: docker compose --project-name test up -d app

      - name: Debug container state
        run: |
          echo "Container status:"
          docker compose --project-name test ps
          echo "App logs:"
          docker compose --project-name test logs app --tail=50
          echo "Port bindings:"
          docker port $(docker compose --project-name test ps -q app) || true

      - name: Wait for app startup
        run: |
          echo "Waiting for app to fully start..."
          for i in $(seq 1 30); do
            if docker compose --project-name test logs app | grep -q "listening on"; then
              echo "App is ready! (found 'listening on' in logs)"
              exit 0
            fi
            if curl -f http://localhost:3000 >/dev/null 2>&1; then
              echo "App responding to requests!"
              exit 0
            fi
            echo "Waiting for app startup... (attempt $i/30)"
            sleep 2
          done
          echo "App failed to start within timeout!"
          echo "Final app logs:"
          docker compose --project-name test logs app --tail=20
          exit 1

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image my-app:latest

      - name: Shutdown supabase
        if: always()
        run: |
          set +e
          pnpm sb:stop --no-backup || true
          if [ -n "${SCHEMA_NAME:-}" ]; then
            docker ps -aq --filter "name=${SCHEMA_NAME}" | xargs -r docker rm -f || true
            docker network ls -q --filter "name=${SCHEMA_NAME}" | xargs -r docker network rm || true
            docker volume ls -q --filter "name=${SCHEMA_NAME}" | xargs -r docker volume rm || true
          fi

      - name: Tear down Docker Compose
        if: always()
        run: docker compose --project-name test down -v --remove-orphans || true

      - name: Runner housekeeping
        if: always()
        run: |
          set +e
          pnpm store prune || true
          docker image rm -f my-app:latest || true
          docker container prune -f --filter "until=24h" || true
          docker image prune -f --filter "until=72h" || true
          docker volume prune -f --filter "until=72h" || true
          docker builder prune -f --filter "until=72h" || true

      - name: Clean up Supabase config
        if: always()
        run: rm -f .env
