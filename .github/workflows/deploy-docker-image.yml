name: 'Push Docker Image to Gitea Registry'

on:
  release:
    types: [published]

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      run_pipeline: ${{ steps.check.outputs.run_pipeline }}
    steps:
      - id: check
        run: |
          if [[ \
            "${{ github.event.repository.name }}" != "sveltekit-template" \
          ]]; then
            echo "run_pipeline=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_pipeline=false" >> "$GITHUB_OUTPUT"
          fi

  format:
    needs: pre-check
    if: needs.pre-check.outputs.run_pipeline == 'true'
    uses: ./.github/workflows/code-formatter.yml

  unit-tests:
    needs: pre-check
    if: needs.pre-check.outputs.run_pipeline == 'true'
    uses: ./.github/workflows/testing-unit.yml

  E2E:
    needs: pre-check
    if: needs.pre-check.outputs.run_pipeline == 'true'
    uses: ./.github/workflows/testing-e2e.yml

  check:
    needs: pre-check
    if: needs.pre-check.outputs.run_pipeline == 'true'
    uses: ./.github/workflows/testing-svelte-check.yml

  docker-compose:
    needs: pre-check
    if: needs.pre-check.outputs.run_pipeline == 'true'
    uses: ./.github/workflows/docker-compose-test.yml

  push-docker-image:
    runs-on: self-hosted
    needs: [format, unit-tests, E2E, check, docker-compose]
    if: needs.pre-check.outputs.run_pipeline == 'true'
    env:
      CI: true
    steps:
      - name: Log in to Gitea Registry
        uses: docker/login-action@v3.5.0
        with:
          registry: ${{ secrets.GITEA_REGISTRY_URL }}
          username: ${{ secrets.GITEA_REGISTRY_USER }}
          password: ${{ secrets.GITEA_REGISTRY_PWD }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Build and push Docker image
        run: |
          set -euo pipefail

          TAG="${{ github.event.release.tag_name }}"
          REPOSITORY="$(basename "$GITHUB_REPOSITORY")"
          IMAGE="${{ secrets.GITEA_REGISTRY_URL }}/${{ secrets.GITEA_REGISTRY_USER }}/${REPOSITORY}"

          docker build \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            .

          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Runner housekeeping
        if: always()
        run: |
          set +e
          docker image prune -f --filter "until=72h" || true
          docker builder prune -f --filter "until=72h" || true
