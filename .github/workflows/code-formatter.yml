name: Format & Lint

on:
  workflow_call:
    #
  push:
    branches-ignore:
      - 'deploy'
      - 'gh-pages'

permissions:
  contents: read

jobs:
  format_and_lint:
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096
    runs-on: self-hosted
    steps:
      - name: Retrieve git dependencies
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          clean: true
          fetch-depth: 1
          # token: ${{ secrets.GH_TOKEN }}Do i rea

      - name: Install dependencies
        run: |
          set -euo pipefail
          echo "Installing dependencies..."
          pnpm install --frozen-lockfile

      - name: Run
        run: |
          echo "Running formatter..."
          pnpm run format --check
          pnpm run lint

      - name: Runner housekeeping
        if: always()
        run: |
          set +e
          pnpm store prune || true
          docker builder prune -f --filter "until=72h" || true
